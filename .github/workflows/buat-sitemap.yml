name: Generate Sitemap

on:
  workflow_dispatch: # Bisa dijalankan manual kapan saja

permissions:
  contents: write

jobs:
  build_sitemap:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Jalankan Skrip Sitemap
        run: python buat_sitemap.py

      - name: Commit & Push Sitemap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Tambahkan sitemap dan skripnya
          git add sitemap.xml buat_sitemap.py || true
          
          git diff --staged --quiet && echo "Tidak ada perubahan" && exit 0
          
          git commit -m "Update sitemap otomatis [skip ci]"
          git push
